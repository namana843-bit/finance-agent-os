name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Desktop Releases (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core & Shared Packages
        run: |
          pnpm --filter @finance/shared build
          pnpm --filter @finance/core build

      - name: Build & Package Desktop Executable
        run: pnpm --filter @finance/dashboard electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          fail_on_unmatched_files: false
          files: |
            apps/dashboard/dist-electron/*.exe
            apps/dashboard/dist-electron/*.dmg
            apps/dashboard/dist-electron/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
